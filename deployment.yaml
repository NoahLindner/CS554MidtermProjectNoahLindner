apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs454-midterm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs454-midterm
  template:
    metadata:
      labels:
        app: cs454-midterm
    spec:
      containers:
      - name: app
        image: cs454-midterm:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: SERVICE_NAME
          value: "cs454-midterm"
        - name: MESSAGE
          value: "Kubernetes Message (Benjamin Franklin)"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3